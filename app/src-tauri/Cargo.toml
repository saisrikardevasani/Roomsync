[package]
name = "roomsync"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "roomsync"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tauri       = { version = "1", features = ["shell-open", "system-tray"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
